services:
  app:
    build: .
    image: cbt-sekolah:latest
    ports:
      - "8080:80"
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:?APP_URL wajib diisi, mis. https://cbt.sekolah.sch.id}
      APP_FORCE_HTTPS: ${APP_FORCE_HTTPS:-true}
      SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-true}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-*}
      LOG_LEVEL: warning
      LOG_CHANNEL: daily
      LOG_DAILY_DAYS: "14"
      QUEUE_CONNECTION: database
    command: sh -c "php artisan optimize && php artisan migrate --force && php artisan app:secure-default-accounts --apply && apache2-foreground"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - storage-app:/var/www/html/storage/app
    restart: unless-stopped

  scheduler:
    image: cbt-sekolah:latest
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      APP_ENV: production
      APP_DEBUG: "false"
      LOG_LEVEL: warning
      LOG_CHANNEL: daily
      LOG_DAILY_DAYS: "14"
      QUEUE_CONNECTION: database
    command: php artisan schedule:work
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy
    volumes:
      - storage-app:/var/www/html/storage/app
    restart: unless-stopped

  queue:
    image: cbt-sekolah:latest
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      APP_ENV: production
      APP_DEBUG: "false"
      QUEUE_CONNECTION: database
      LOG_LEVEL: warning
      LOG_CHANNEL: daily
      LOG_DAILY_DAYS: "14"
    command: php artisan queue:work --sleep=1 --tries=3 --max-time=3600
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy
    volumes:
      - storage-app:/var/www/html/storage/app
    restart: unless-stopped

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-cbt_laravel}
      MYSQL_USER: ${DB_USERNAME:-cbt}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD wajib diisi di .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD wajib diisi di .env}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  db-data:
  storage-app:
